name: Render Jarvis branded home-screen icons
on:
  push:
    paths:
      - icon.svg
      - .github/workflows/render-home-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: python -m pip install --quiet cairosvg
      - name: Render iPhone and PWA icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in [180, 192, 512]:
              cairosvg.svg2png(url="icon.svg", write_to=f"icon-{size}.png", output_width=size, output_height=size)
          PY
      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Jarvis branded iPhone and PWA PNG icons"
            git push
          fi
